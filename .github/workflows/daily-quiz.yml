name: Daily Quiz Email

on:
  schedule:
    # 3:30 AM UTC = 9:00 AM IST every day
    - cron: '30 3 * * *'
  workflow_dispatch:
    # Manual trigger for testing

jobs:
  send-quiz:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to commit updated agents.json back to the repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Create quiz-output directory
        run: mkdir -p quiz-output

      # ── Step 1: Sync agents from today's Ozonetel CDR ──────────────────────
      - name: Sync agent list from Ozonetel CDR
        run: node scripts/sync-agents.js

      # ── Step 2: Commit agents.json back if new agents were added ───────────
      - name: Commit updated agent list (if changed)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/agents.json
          if git diff --staged --quiet; then
            echo "No new agents — agents.json unchanged."
          else
            git commit -m "chore: add new agent(s) from CDR sync [skip ci]"
            git push
            echo "Committed updated agents.json."
          fi

      # ── Step 3: Read recipient emails from agents.json ─────────────────────
      - name: Read recipient emails
        id: recipients
        run: |
          EMAILS=$(node -e "const a=require('./scripts/agents.json'); process.stdout.write(a.agents.map(x=>x.email).join(', '))")
          echo "emails=$EMAILS" >> $GITHUB_OUTPUT
          echo "Recipients: $EMAILS"

      # ── Step 4: Generate today's quiz via Claude ───────────────────────────
      - name: Generate today's quiz
        run: node scripts/generate-quiz.js
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Get quiz date
        id: date
        run: echo "DATE=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Get display date
        id: displaydate
        run: echo "DISPLAY=$(date +'%A, %d %B %Y')" >> $GITHUB_OUTPUT

      # ── Step 5: Email quiz to all agents ──────────────────────────────────
      - name: Send quiz via email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_USER }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          to: ${{ steps.recipients.outputs.emails }}
          from: LabsPitch Training <${{ secrets.GMAIL_USER }}>
          subject: "🧠 Daily Training Quiz — ${{ steps.displaydate.outputs.DISPLAY }}"
          body: |
            Hi team,

            Your daily training quiz for ${{ steps.displaydate.outputs.DISPLAY }} is attached.

            📎 Open the HTML file in any browser (Chrome, Safari, Firefox) — no internet needed.
            🧠 10 fresh questions · Medium difficulty · Mix of Medical & Sales topics
            ✅ Submit your answers to see your score and explanations instantly.

            Keep sharpening those skills! 💪

            —
            LabsPitch Training System
            Truemeds Diagnostics
          attachments: quiz-output/quiz-${{ steps.date.outputs.DATE }}.html
          priority: normal
